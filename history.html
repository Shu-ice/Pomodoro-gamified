<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ポモドーロ履歴</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ポモドーロ履歴</h1>
      <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>
    
    <div class="history-filters">
      <select id="dateFilter">
        <option value="all">すべての期間</option>
        <option value="today">今日</option>
        <option value="week">今週</option>
        <option value="month">今月</option>
      </select>
      <button id="exportBtn" class="export-btn">
        <i class="fas fa-download"></i> CSVエクスポート
      </button>
    </div>

    <div class="history-stats">
      <div class="stat-card">
        <h3>総作業時間</h3>
        <p id="totalTime">0時間</p>
      </div>
      <div class="stat-card">
        <h3>完了したポモドーロ</h3>
        <p id="completedPomodoros">0回</p>
      </div>
    </div>

    <div class="chart-container">
      <h2>週間統計</h2>
      <canvas id="historyChartWeekly"></canvas>
    </div>

    <div class="history-list">
      <h2>詳細履歴</h2>
      <div id="historyItems" class="history-items">
        <!-- 履歴アイテムはJavaScriptで動的に追加されます -->
      </div>
    </div>

    <div class="navigation">
      <a href="index.html" class="nav-link">
        <i class="fas fa-arrow-left"></i> タイマーに戻る
      </a>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
