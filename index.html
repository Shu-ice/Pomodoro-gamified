<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#007AFF"/>
  <title>ゲーミフィケーションポモドーロ</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    window.onload = function() {
      const width = 320; // アプリの幅
      const height = 580; // アプリの高さ
      window.resizeTo(width, height);
    };
  </script>
</head>
<body>
  <div class="container">
    <button class="minimize-btn">−</button>
    <div class="content">
      <div class="header">
        <h1>ポモドーロタイマー</h1>
        <button id="themeToggle" class="theme-toggle">🌙</button>
      </div>

      <nav class="main-nav">
        <button class="nav-item active" data-page="timer">タイマー</button>
        <button class="nav-item" data-page="history">履歴</button>
        <button class="nav-item" data-page="settings">設定</button>
      </nav>

      <!-- タイマーページ -->
      <div class="page active" id="timer-page">
        <div class="timer-container">
          <div class="progress-ring">
            <svg class="progress-ring__circle" width="300" height="300">
              <circle class="progress-ring__circle-bg" cx="150" cy="150" r="120" />
              <circle class="progress-ring__circle-progress" cx="150" cy="150" r="120" />
            </svg>
            <div class="timer">
              <span id="minutes">25</span>:<span id="seconds">00</span>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn">スタート</button>
          <button id="resetBtn">リセット</button>
        </div>

        <div class="points-display">
          <span class="points-label">ポイント</span>
          <span id="points" class="points-value">0</span>
        </div>
      </div>

      <!-- 履歴ページ -->
      <div class="page" id="history-page">
        <div class="level-display">
          <div class="level-circle">
            <span id="level" class="level-number">1</span>
            <div class="level-progress">
              <div id="levelProgress" class="level-progress-bar"></div>
            </div>
          </div>
          <div class="level-info">
            <span class="level-label">レベル</span>
            <span id="nextLevelInfo" class="next-level-info">次のレベルまで: 100ポイント</span>
          </div>
        </div>

        <div class="stats-container">
          <div class="calendar">
            <div class="calendar-header">
              <button id="prevMonth">←</button>
              <h3 id="currentMonth">2023年4月</h3>
              <button id="nextMonth">→</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
          </div>
          <div class="chart-container">
            <canvas id="statsChart"></canvas>
          </div>
        </div>

        <div class="level-progress-chart">
          <h3>レベル進捗</h3>
          <canvas id="levelChart"></canvas>
        </div>

        <div class="history-list">
          <h3>最近の記録</h3>
          <ul id="historyList"></ul>
        </div>
      </div>

      <!-- 設定ページ -->
      <div class="page" id="settings-page">
        <div class="settings-panel">
          <h2>タイマー設定</h2>
          <div class="settings-group">
            <div class="settings-row">
              <label for="workTime">作業時間（分）</label>
              <input type="number" id="workTime" value="25" min="1" max="60">
            </div>
            <div class="settings-row">
              <label for="breakTime">休憩時間（分）</label>
              <input type="number" id="breakTime" value="5" min="1" max="30">
            </div>
            <div class="settings-row">
              <label for="longBreakTime">長い休憩時間（分）</label>
              <input type="number" id="longBreakTime" value="15" min="1" max="60">
            </div>
            <div class="settings-row">
              <label for="sessionsBeforeLongBreak">長い休憩までのセッション数</label>
              <input type="number" id="sessionsBeforeLongBreak" value="4" min="1" max="10">
            </div>
          </div>

          <div class="settings-group">
            <h2>表示設定</h2>
            <div class="settings-row">
              <label for="fixedPosition">画面上に固定</label>
              <input type="checkbox" id="fixedPosition" checked>
            </div>
          </div>

          <div class="settings-group">
            <h2>通知設定</h2>
            <div class="settings-row">
              <label for="soundEnabled">通知音</label>
              <input type="checkbox" id="soundEnabled" checked>
            </div>
            <div class="settings-row">
              <label for="desktopNotifications">デスクトップ通知</label>
              <input type="checkbox" id="desktopNotifications" checked>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="minimized-view">
      <span id="minimizedTimer">25:00</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
