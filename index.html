```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#007AFF"/>
  <title>ゲーミフィケーションポモドーロ</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <button class="minimize-btn" title="最小化/最大化">−</button>
    <div class="content">
      <div class="header">
        <h1>ポモドーロタイマー</h1>
        <button id="themeToggle" class="theme-toggle" title="テーマ切替">🌙</button>
      </div>

      <nav class="main-nav">
        <button class="nav-item active" data-page="timer">タイマー</button>
        <button class="nav-item" data-page="history">履歴</button>
        <button class="nav-item" data-page="settings">設定</button>
      </nav>

      <!-- タイマーページ -->
      <div class="page active" id="timer-page">
        <div class="timer-container">
          <svg class="progress-ring__circle" width="220" height="220">
            <!-- グラデーション定義 -->
            <defs>
              <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#007AFF" />
                <stop offset="100%" stop-color="#00C6FF" />
              </linearGradient>
              <linearGradient id="breakGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4CAF50" />
                <stop offset="100%" stop-color="#8BC34A" />
              </linearGradient>
            </defs>
            <circle class="progress-ring__circle-bg" cx="110" cy="110" r="100" />
            <circle class="progress-ring__circle-progress" cx="110" cy="110" r="100" />
          </svg>
          <div class="timer">
            <span id="minutes">25</span>:<span id="seconds">00</span>
          </div>
        </div>

        <div class="controls">
          <button id="startBtn" class="ripple">スタート</button>
          <button id="resetBtn" class="ripple">リセット</button>
        </div>

        <div class="points-display">
          <div>
            <span class="points-label">ポイント</span>
            <span id="points" class="points-value">0</span>
          </div>
          <div>
            <span class="points-label">レベル</span>
            <span id="level" class="points-value">1</span>
          </div>
          <div class="level-info">
            <div class="points-bar-container">
              <div class="points-bar" style="width: 0%"></div>
            </div>
            <span id="nextLevelInfo" class="next-level-info">次のレベルまで: 100ポイント</span>
          </div>
        </div>
      </div>

      <!-- 履歴ページ -->
      <div class="page" id="history-page">
        <div class="stats-container">
          <div class="calendar">
            <div class="calendar-header">
              <button id="prevMonth">←</button>
              <h3 id="currentMonth">2023年4月</h3>
              <button id="nextMonth">→</button>
            </div>
            <div class="calendar-grid" id="calendarGrid">
              <!-- カレンダーはJSで生成 -->
            </div>
          </div>
          <div class="chart-container">
            <canvas id="statsChart"></canvas>
          </div>
        </div>

        <div class="level-progress-chart">
          <h3>レベル進捗</h3>
          <canvas id="levelChart"></canvas>
        </div>

        <div class="history-list">
          <h3>最近の記録</h3>
          <ul id="historyList"></ul>
          <button id="showAllHistoryBtn" class="ripple">すべての履歴を見る</button>
        </div>
      </div>

      <!-- 設定ページ -->
      <div class="page" id="settings-page">
        <div class="settings-panel">
          <h2>タイマー設定</h2>
          <div class="settings-group">
            <div class="settings-row">
              <label for="workTime">作業時間（分）</label>
              <input type="number" id="workTime" value="25" min="1" max="60">
            </div>
            <div class="settings-row">
              <label for="breakTime">休憩時間（分）</label>
              <input type="number" id="breakTime" value="5" min="1" max="30">
            </div>
            <div class="settings-row">
              <label for="longBreakTime">長い休憩時間（分）</label>
              <input type="number" id="longBreakTime" value="15" min="1" max="60">
            </div>
            <div class="settings-row">
              <label for="sessionsBeforeLongBreak">長い休憩までのセッション数</label>
              <input type="number" id="sessionsBeforeLongBreak" value="4" min="1" max="10">
            </div>
          </div>

          <div class="settings-group">
            <h2>表示設定</h2>
            <div class="settings-row">
              <label for="fixedPosition">画面上に固定</label>
              <label class="switch">
                <input type="checkbox" id="fixedPosition" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="settings-group">
            <h2>通知設定</h2>
            <div class="settings-row">
              <label for="soundEnabled">通知音</label>
              <label class="switch">
                <input type="checkbox" id="soundEnabled" checked>
                <span class="slider"></span>
              </label>
            </div>
            <div class="settings-row">
              <label for="desktopNotifications">デスクトップ通知</label>
              <label class="switch">
                <input type="checkbox" id="desktopNotifications" checked>
                <span class="slider"></span>
              </label>
            </div>
          </div>

          <div class="settings-group">
            <h2>データ管理</h2>
            <div class="settings-actions">
              <button id="exportBtn" class="export-btn">
                <i class="fas fa-download"></i> データをエクスポート
              </button>
              <button id="resetDataBtn" class="reset-data-btn">
                <i class="fas fa-trash"></i> データをリセット
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="minimized-view">
      <span id="minimizedTimer">25:00</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
```
